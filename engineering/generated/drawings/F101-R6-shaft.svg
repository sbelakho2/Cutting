<text x='17' y='228' font-size='3.1'>Material42CrMo4+QT,certified yield≥650MPa;rough stockØ20×120;quantity8. General axial coordinates±0.02.</text>
<text x='17' y='236' font-size='2.8'>ENDS: external C0.20±0.02 at S0/S113;M15 lead C0.50±0.02. Full-profile M15 thread required over S65.10–71.30.</text>
<text x='17' y='244' font-size='3.1'>ASSEMBLY: fit MB2 BEFORE pulley key. Keep F112 removable;insert preassembled rotor from+S with locating dowels removed.</text>
<text x='17' y='252' font-size='3.1'>RELEASE HOLD: local stress/contact,thermal-field validation and joint preload. R6 edge geometry is defined on both sheets.</text>
