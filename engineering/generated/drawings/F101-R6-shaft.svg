<text x='17' y='139' font-size='3.4'>DATUM A: common bearing-seat axis. DATUM B: front bearing shoulder S82.</text>
<text x='17' y='147' font-size='3.1'>Bearing seats: j5 −0.003/+0.005 AND 0.003–0.006 actual interference to assigned SKF P6 bore.</text>
<text x='17' y='154' font-size='3.1'>12 h6 /14 h6: −0.011/0;10 h6: −0.009/0. Match-bearing table governs final seat diameters.</text>
<text x='17' y='161' font-size='3.1'>Bearing-seat cylindricity0.001,total radial runout0.002 to A;B perpendicularity0.004 to A.</text>
<text x='17' y='168' font-size='3.1'>Ø14/Ø10 total runout0.010 to A. Bearing seats Ra0.4µm;roller/coupling0.8µm;other surfaces3.2µm.</text>
<text x='17' y='177' font-size='2.8'>PULLEY KEY: S33.45–61.55,L28.10±0.02,W5.04±0.01,on+Z;floorZ4.00±0.02;endsR2.52.</text>
<text x='17' y='183' font-size='2.8'>ROLLER KEY: S94.45–112.55,L18.10±0.02,W3.04±0.01,on−Z;floorZ−3.20±0.02;endsR1.52.</text>
<text x='17' y='189' font-size='2.8'>Both key-floor perimeters R0.15±0.02;matching keys:shaft-facing perimeter0.20±0.02×45°.</text>
<text x='17' y='195' font-size='2.6'>MB2 SLOT: S31.20–73.00,W4.20±0.05,on+Z;floorZ5.50±0.05;R0.50plan/intersections,R0.15floor. See sheet2.</text>
<text x='17' y='201' font-size='2.8'>GROOVE: S18.50±0.02,W1.12±0.02,Ø11.45±0.02;both rootsR0.04±0.01;SEEGER A12.</text>
<text x='17' y='207' font-size='2.8'>SHOULDERS: S31.5/S82/S92 R0.20±0.02;S87 R0.50±0.05;M15 relief rootsR0.20±0.02.</text>
<text x='17' y='213' font-size='2.6'>END TAP: M5×0.8-6H,14.00–14.05full thread AFTER C0.20±0.02;drillØ4.20+0.03/0×18.00±0.05 PLUS118°±2° point.</text>
