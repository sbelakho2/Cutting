<text x='60' y='230' font-size='3.1'>DATUM A = SPINDLE AXIS · radial runout ≤0.010 between seats;cylindricity ≤0.004 on seats</text>
<text x='60' y='238' font-size='3.1'>DATUM B = left seat centreline at Y=−279.5 (machine coords);seats spanY=−289…−271 andY=+271…+289</text>
<text x='250' y='60' font-size='3.1'>Material C45 (EN 1.0503),ground stock</text>
<text x='250' y='68' font-size='3.1'>Surface finish Ra0.8 on Ø20, Ra1.6 elsewhere</text>
<text x='250' y='76' font-size='3.1'>Both ends chamfer C0.5;no centre hole specified</text>
<text x='250' y='84' font-size='3.1'>Hardness: as-supplied;no heat treatment</text>
<text x='250' y='100' font-size='3.1'>Interface: spool P001 rides on Ø20 through</text>
<text x='250' y='108' font-size='3.1'>two Ø20.5 flange bores;brake disc P006</text>
<text x='250' y='116' font-size='3.1'>sits on Ø20 outboard of the right post.</text>
<text x='250' y='124' font-size='3.1'>Retention:2 × M20×1.5 nut (KM-class)</text>
<text x='250' y='132' font-size='3.1'>with tab washer, supplier-selected;</text>
<text x='250' y='140' font-size='3.1'>threads are NOT modeled in the CAD.</text>
<line class='edge' x1='8' y1='222' x2='412' y2='222'/>
<text x='14' y='231' font-size='3.1'>PROCESS: centreless-grind Ø20 h6;single-point the M20×1.5 ends from the ground diameter;deburr.</text>
<text x='14' y='239' font-size='3.1'>INSPECT: length660;Ø20 actual within h6;seat runout/cylindricity;thread gauging;visual for grinding burns.</text>
<text x='14' y='247' font-size='3.1'>ASSEMBLY: fit 6204 bearings into P004/P005 pockets;insert spindle through spool bores and bearings;</text>
<text x='14' y='255' font-size='3.1'>clamp P006 and nut M20×1.5 outboard. Match-mark bearing-to-post and nut-to-shaft after first fit.</text>
