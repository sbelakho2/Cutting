<text x='17' y='181' font-size='3.1'>PULLEY KEY: S33.45–61.55,length28.10±0.02,width5.04±0.01,on+Z;floorZ4.00±0.02;endsR2.52.</text>
<text x='17' y='188' font-size='3.1'>ROLLER KEY: S94.45–112.55,length18.10±0.02,width3.04±0.01,on−Z;floorZ−3.20±0.02;endsR1.52.</text>
<text x='17' y='195' font-size='3.1'>MB2 SLOT: S31.40–73.00,width4.20±0.05,on+Z;floorZ5.50±0.05. Must open across the full pulley seat.</text>
<text x='17' y='202' font-size='3.1'>GROOVE: startS18.50±0.02,width1.12±0.02,Ø11.45±0.02;SEEGER A12. Root detail remains pending.</text>
<text x='17' y='209' font-size='3.1'>END TAP atS113: M5×0.8-6H,14mm full thread;minor drillØ4.2. Tapping/drill bottom clearance required.</text>
