<text x='17' y='228' font-size='3.1'>Material42CrMo4+QT,certified yield≥650MPa;rough stockØ20×120;quantity8. General axial coordinates±0.02.</text>
<text x='17' y='236' font-size='3.1'>PROCESS: rough-turn;cut keys/slot/thread/groove;finish matched bearing journals together;deburr;inspect at20°C.</text>
<text x='17' y='244' font-size='3.1'>ASSEMBLY: fit MB2 BEFORE pulley key. Keep F112 removable;insert preassembled rotor from+S with locating dowels removed.</text>
<text x='17' y='252' font-size='3.1'>RELEASE HOLD: turning/key-root radii/reliefs,local stress/thermal-field validation and joint preload. Do not machine sharp roots.</text>
