<text x='73' y='30.6' font-size='3.1'>Ø47 H7 +0.025/0</text>
<text x='17' y='180' font-size='3.1'>POST (2×, MIRRORED): 70 × 18 plate;bearing pocket Ø47 H7 ×14 deep</text>
<text x='17' y='187' font-size='3.1'>from the spool-side face;spindle bore Ø20.5 +0.2/0 through.</text>
<text x='17' y='194' font-size='3.1'>Pocket and bore share the datum axis (X−650,Z112 machine coords).</text>
<text x='17' y='201' font-size='3.1'>Z span −845…+320;welded to P003 base all around;grind top face flat.</text>
<text x='17' y='208' font-size='3.1'>Material S235JR;laser/waterjet + bore on mill;deburr without chamfering the pocket.</text>

<text x='198' y='216.6' font-size='3.1'>Ø180 ±0.5</text>
<text x='258' y='60' font-size='3.1'>BRAKE DISC (1×): Ø180 × 6, bore Ø20 H7</text>
<text x='258' y='68' font-size='3.1'>+0.021/0 on the spindle, keyway 6 JS9 ×</text>
<text x='258' y='76' font-size='3.1'>2.8 deep (DIN6885-A key) and one M6×8</text>
<text x='258' y='84' font-size='3.1'>ISO4029 cup-point setscrew over the key.</text>
<text x='258' y='92' font-size='3.1'>Faces ground flat, parallel ≤0.05, Ra1.6.</text>
<text x='258' y='100' font-size='3.1'>Material S235JR;blank laser-cut, finish-turned.</text>
<text x='258' y='116' font-size='3.1'>Caliper bracket P007 is a plain S235JR</text>
<text x='258' y='124' font-size='3.1'>bracket per docs/26 §3 (pads/spring</text>
<text x='258' y='132' font-size='3.1'>purchase-to-requirement);no machining</text>
<text x='258' y='140' font-size='3.1'>tolerances are released on this sheet.</text>
<text x='258' y='156' font-size='3.1'>SPOOL P001: two S235JR flanges Ø400 x3,</text>
<text x='258' y='164' font-size='3.1'>bore Ø20.5 +0.2/0, laser-cut, welded to a</text>
<text x='258' y='172' font-size='3.1'>Ø60x2.5 ERW hub tube 160 long; hub passes</text>
<text x='258' y='180' font-size='3.1'>through both flanges (welded joint); paint.</text>
<text x='258' y='188' font-size='3.1'>DRIVE BOSS P008: C45 Ø54.6 x 12, 20H7 bore plus</text>
<text x='258' y='196' font-size='3.1'>6JS9 keyseat; welded to the left flange inside the hub.</text>
<text x='258' y='204' font-size='3.1'>Keyed to the spindle key; transmits the brake torque</text>
<text x='258' y='212' font-size='3.1'>into the spool. NB the whole assembly is 60 mm further</text>
<text x='258' y='220' font-size='3.1'>outboard than R1 (spool at X-710) - see docs/26.</text>
<text x='258' y='236' font-size='3.1'>BASE P003: S235JR 430x560x8; four Ø13</text>
<text x='258' y='204' font-size='3.1'>anchor holes at 340x470 spacing; edges</text>
<text x='258' y='212' font-size='3.1'>deburred; posts welded to the top face.</text>
<line class='edge' x1='8' y1='222' x2='412' y2='222'/>
<text x='14' y='231' font-size='3.1'>PROCESS: cut blanks;mill pockets/bore to the common datum;weld posts to base with a fixture holding both posts</text>
<text x='14' y='239' font-size='3.1'>coaxial;stress-relieve;re-check pocket positions after welding.INSPECT: pocket Ø47 H7, coaxiality of the</text>
<text x='14' y='247' font-size='3.1'>two posts ≤0.1 after welding;disc bore and faces.ASSEMBLY: press 6204 bearings;insert spindle.</text>
