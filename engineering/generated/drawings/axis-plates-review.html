<text x='243' y='60' font-size='3.1'>H006 CARRIAGE PLATE 6082-T6: pad 60x75 at 46 mm height;</text>
<text x='243' y='67' font-size='3.1'>Ø49.97 F0 register, 4x M5 on PCD70, 4x M6 on 46x46;</text>
<text x='243' y='74' font-size='3.1'>DSG16h nut pocket on the underside; 4x HGH20CA lands.</text>
<text x='243' y='81' font-size='3.1'>Top face flat 0.02; F0 register perpendicular 0.02.</text>
<text x='243' y='95' font-size='3.1'>Contract: reproduce the KK86 carriage interface exactly</text>
<text x='243' y='102' font-size='3.1'>(docs/39 §2) so H003 and the adapter FEM stay valid.</text>
<text x='243' y='109' font-size='3.1'>Screw end Ø8 h7 x18 exposed; Ø46 service cavity.</text>
<line class='edge' x1='8' y1='222' x2='412' y2='222'/>
<text x='14' y='231' font-size='3.1'>PROCESS: plate stock, mill both faces, drill/tap patterns from the fixture; register bore in the same setup.</text>
<text x='14' y='239' font-size='3.1'>INSPECT: flatness, hole positions ±0.05, register Ø49.97, M5/M6 tapping depth, nut-pocket depth.</text>
<text x='14' y='247' font-size='3.1'>ASSEMBLY: rails to H005, blocks to H006, nut housing in pocket, screw through BK12/BF12; run-in 1 h;</text>
<text x='14' y='255' font-size='3.1'>re-measure preload and repeatability ±0.02 over 194 mm (DTI); record in the build record.</text>
